name: Build APK and Upload to SFTP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 先在 CI 上验证 Node 侧逻辑（CouchDB 兼容端点 + 快照持久化 + 优雅退出），
    # 避免打完 APK 才发现依赖/协议问题
    - name: Node selftest
      working-directory: ./nodejs-project
      run: |
        npm install --omit=dev --no-audit --no-fund
        npm run selftest

    - name: Prepare node project for assets
      run: |
        chmod +x scripts/prepare-node-project.sh
        ./scripts/prepare-node-project.sh

    - name: Fetch nodejs-mobile runtime (libnode.so)
      env:
        NODEJS_MOBILE_VERSION: v18.20.4
      run: |
        chmod +x scripts/fetch-nodejs-mobile.sh
        ./scripts/fetch-nodejs-mobile.sh

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 注意：不要再装 "tools" 包，新版 cmdline-tools 已移除它，会导致 sdkmanager 退出码 1
        packages: platform-tools

    - name: Install SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
        sdkmanager --list_installed | grep -E "platforms|build-tools|ndk|cmake" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    # ========== 版本号处理 ==========
    # VERSION_CODE 取 git commit 数量（单调递增，和代码进度强绑定），
    # 不再用 GITHUB_RUN_NUMBER——后者和 GitHub UI 显示的 run # 可能不一致
    # （取消/重跑/历史 run 都会让两者错位），导致 "build 41 产出的包是 38" 的困惑。
    - name: Compute version
      id: version
      run: |
        # commit 数量作为 versionCode：永远单调递增，和代码进度一一对应
        COMMIT_COUNT=$(git rev-list --count HEAD)
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="ci-${COMMIT_COUNT}"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "VERSION_CODE=${COMMIT_COUNT}" >> "$GITHUB_ENV"
        APK_NAME="pouchdb-server-apk-${VERSION}-build${COMMIT_COUNT}.apk"
        ZIP_NAME="pouchdb-server-apk-${VERSION}-build${COMMIT_COUNT}.zip"
        echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
        echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
        echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "version_code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
        # 打印对账信息，CI 日志里直接可见
        echo "=== 版本号 ==="
        echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}（UI 显示的 run #）"
        echo "COMMIT_COUNT=${COMMIT_COUNT}（versionCode）"
        echo "VERSION_NAME=${VERSION}"
        echo "APK=${APK_NAME}"

    # ========== 签名 + 构建 ==========
    - name: Setup Release Keystore and Build
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
        VERSION_NAME: ${{ env.VERSION }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Building Release APK with keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          export KEYSTORE_PATH=release-key.jks
          gradle assembleRelease
          echo "APK_TYPE=release" >> $GITHUB_ENV
        else
          echo "Building Debug APK (no keystore secrets configured)..."
          gradle assembleDebug
          echo "APK_TYPE=debug" >> $GITHUB_ENV
        fi

    # ========== 重命名 APK ==========
    - name: Rename APK with version
      run: |
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          echo "APK_TYPE=release" >> $GITHUB_ENV
        else
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          echo "APK_TYPE=debug" >> $GITHUB_ENV
        fi
        ls -lh app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.apk_name }}

    # ========== Artifact 上传（唯一分发源，已验证可安装）==========
    # 注意：之前另有一条 SFTP 上传，会保留历史旧文件导致下载到旧/不同签名的包而无法安装。
    # 现已移除，统一以 GitHub Actions Artifact 为唯一可信源（每次都是本次运行的最新构建）。
    - name: Upload APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ env.APK_TYPE }}
        path: app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.apk_name }}
        retention-days: 90
