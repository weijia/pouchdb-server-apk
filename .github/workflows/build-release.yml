name: Build APK and Upload to SFTP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 先在 CI 上验证 Node 侧逻辑（CouchDB 兼容端点 + 快照持久化），
    # 避免打完 APK 才发现依赖/协议问题
    - name: Node selftest
      working-directory: ./nodejs-project
      run: |
        npm ci --no-audit --no-fund
        npm run selftest

    - name: Prepare node project for assets
      run: |
        chmod +x scripts/prepare-node-project.sh
        ./scripts/prepare-node-project.sh

    - name: Fetch nodejs-mobile runtime (libnode.so)
      env:
        NODEJS_MOBILE_VERSION: v18.20.4
      run: |
        chmod +x scripts/fetch-nodejs-mobile.sh
        ./scripts/fetch-nodejs-mobile.sh

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 注意：不要再装 "tools" 包，新版 cmdline-tools 已移除它，会导致 sdkmanager 退出码 1
        packages: platform-tools

    - name: Install SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
        sdkmanager --list_installed | grep -E "platforms|build-tools|ndk|cmake" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    # ========== 版本号处理（参照 go-stock-server：从 git tag / run_number 计算，交由 Gradle 读取）==========
    - name: Compute version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="ci-${GITHUB_RUN_NUMBER}"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
        APK_NAME="pouchdb-server-apk-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
        ZIP_NAME="pouchdb-server-apk-${VERSION}-build${GITHUB_RUN_NUMBER}.zip"
        echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
        echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
        echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    # ========== 签名 + 构建 ==========
    - name: Setup Release Keystore and Build
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
        VERSION_NAME: ${{ env.VERSION }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Building Release APK with keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          export KEYSTORE_PATH=release-key.jks
          gradle assembleRelease
          echo "APK_TYPE=release" >> $GITHUB_ENV
        else
          echo "Building Debug APK (no keystore secrets configured)..."
          gradle assembleDebug
          echo "APK_TYPE=debug" >> $GITHUB_ENV
        fi

    # ========== 重命名 APK ==========
    - name: Rename APK with version
      run: |
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          echo "APK_TYPE=release" >> $GITHUB_ENV
        else
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          echo "APK_TYPE=debug" >> $GITHUB_ENV
        fi
        ls -lh app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.apk_name }}

    # ========== 打 zip 包（上传用 zip 而不是裸 apk）==========
    - name: Zip APK
      run: |
        cd app/build/outputs/apk/${{ env.APK_TYPE }}
        zip -j "${{ steps.version.outputs.zip_name }}" "${{ steps.version.outputs.apk_name }}"
        ls -lh "${{ steps.version.outputs.zip_name }}"

    # ========== SFTP 上传 ==========
    # 同时提供 zip（归档）与裸 apk（直接安装），避免“装了 zip 导致解析包错误”
    - name: Upload APK (zip) to SFTP
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      uses: weijia/action-upload-sftp@master
      with:
        sftp-host: ${{ secrets.SFTP_HOST }}
        sftp-port: ${{ secrets.SFTP_PORT }}
        sftp-username: ${{ secrets.SFTP_USERNAME }}
        sftp-password: ${{ secrets.SFTP_PASSWORD }}
        source-path: app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.zip_name }}
        remote-path: /home/github/apps/pouchdb-server-apk/${{ steps.version.outputs.zip_name }}
        cleanup-old-files: 'true'
        max-keep-files: 5

    - name: Upload raw APK to SFTP (direct install)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      uses: weijia/action-upload-sftp@master
      with:
        sftp-host: ${{ secrets.SFTP_HOST }}
        sftp-port: ${{ secrets.SFTP_PORT }}
        sftp-username: ${{ secrets.SFTP_USERNAME }}
        sftp-password: ${{ secrets.SFTP_PASSWORD }}
        source-path: app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.apk_name }}
        remote-path: /home/github/apps/pouchdb-server-apk/${{ steps.version.outputs.apk_name }}
        cleanup-old-files: 'false'

    # ========== Artifact 上传 ==========
    - name: Upload APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ env.APK_TYPE }}
        path: app/build/outputs/apk/${{ env.APK_TYPE }}/${{ steps.version.outputs.apk_name }}
