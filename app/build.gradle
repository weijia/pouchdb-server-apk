plugins {
    id 'com.android.application'
}

android {
    namespace 'net.weijia.pouchdbserver'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'net.weijia.pouchdbserver'
        minSdk 24            // nodejs-mobile 要求 API 24+
        targetSdk 34
        // 版本号由 CI 通过环境变量注入（参照 go-stock-server）；
        // 本地构建无环境变量时使用默认值。
        def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        def vName = System.getenv("VERSION_NAME") ?: "1.0.0"
        versionCode vCode
        versionName vName

        ndk {
            // 只保留移动设备主流架构，x86_64 会显著增大 APK
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 固定签名：keystore 提交进仓库（app/debug.keystore，密码 android）。
    // 保证 CI 与本地构建都签同一把钥匙，避免 ephemeral runner 每次生成不同
    // debug key 导致覆盖安装报"与现有软件包冲突"（同 go-stock-server 方案）。
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // CI 设了 KEYSTORE_PATH 时，额外提供自定义发布签名
        if (System.getenv("KEYSTORE_PATH") != null) {
            release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "release"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        // 本地调试包使用独立 applicationId（net.weijia.pouchdbserver.debug），
        // 避免与 CI 发布的 release 包（net.weijia.pouchdbserver）因签名不同
        // 在"同名 package + 不同签名"时安装器报"与原有软件冲突"。
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 默认用仓库内固定 keystore（与 debug 同签）；
            // CI 设了 KEYSTORE_PATH 则改用自定义发布签名。
            signingConfig(System.getenv("KEYSTORE_PATH") != null
                ? signingConfigs.release : signingConfigs.debug)
        }
    }

    packagingOptions {
        // node 运行时与 native 库冲突时的兜底策略
        pickFirst 'lib/*/libnode.so'
        pickFirst 'lib/*/libc++_shared.so'
    }

    // assets 里包含完整 node_modules（数千个 js 文件），保持压缩状态可小约 10MB。
    // APK 体积的大头是 libnative（libnode.so 两个 ABI），native 库在 APK 内不压缩，
    // 若要进一步瘦身：只保留 arm64-v8a，或在 manifest 设 android:extractNativeLibs="false"。
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}

// ============ 签名配置 ============
// 已移入上方 android {} 内的 signingConfigs：固定使用仓库内 app/debug.keystore，
// 保证 CI 与本地构建每次签名一致（避免覆盖安装报“与现有软件包冲突”）。
// CI 如设置了 KEYSTORE_PATH 环境变量，则 release 包改用自定义发布签名。
