plugins {
    id 'com.android.application'
}

android {
    namespace 'net.weijia.pouchdbserver'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'net.weijia.pouchdbserver'
        minSdk 24            // nodejs-mobile 要求 API 24+
        targetSdk 34
        // 版本号由 CI 通过环境变量注入（参照 go-stock-server）；
        // 本地构建无环境变量时使用默认值。
        def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        def vName = System.getenv("VERSION_NAME") ?: "1.0.0"
        versionCode vCode
        versionName vName

        ndk {
            // 只保留移动设备主流架构，x86_64 会显著增大 APK
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        // 本地调试包使用独立 applicationId（net.weijia.pouchdbserver.debug），
        // 避免与 CI 发布的 release 包（net.weijia.pouchdbserver）因签名不同
        // 在“同名 package + 不同签名”时安装器报“与原有软件冲突”。
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // node 运行时与 native 库冲突时的兜底策略
        pickFirst 'lib/*/libnode.so'
        pickFirst 'lib/*/libc++_shared.so'
    }

    // assets 里包含完整 node_modules（数千个 js 文件），保持压缩状态可小约 10MB。
    // APK 体积的大头是 libnative（libnode.so 两个 ABI），native 库在 APK 内不压缩，
    // 若要进一步瘦身：只保留 arm64-v8a，或在 manifest 设 android:extractNativeLibs="false"。
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}

// ============ 签名配置 ============
// 放在 android {} 之后：Groovy DSL 下在块内调用 System.getenv() + file() 会报
// "No signature of method: java.lang.String.call()"。
// 本地构建不设置环境变量时整段跳过，使用 debug 签名；
// CI 设置了 KEYSTORE_PATH 时使用 release 签名（保证可覆盖安装）。
if (System.getenv("KEYSTORE_PATH") != null && System.getenv("KEYSTORE_PASSWORD") != null) {
    android.signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH"))
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "release"
            keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
} else {
    // 无 keystore 时回退到固定的 debug 签名，保证 APK 可覆盖安装
    android.buildTypes.release.signingConfig android.signingConfigs.debug
}
